<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vercel Plugin Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #000; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
  h1 { font-size: 3rem; background: linear-gradient(90deg, #fff, #888); -webkit-background-clip: text; color: transparent; margin-bottom: 1rem; }
  p { color: #888; max-width: 600px; line-height: 1.6; margin-bottom: 2rem; }
  a.btn { background: #fff; color: #000; padding: 0.8rem 2rem; border-radius: 999px; text-decoration: none; font-weight: 600; transition: transform 0.2s; }
  a.btn:hover { transform: scale(1.05); }
</style>
</head>
<body>
  <h1>Welcome to My Website</h1>
  <p>Built with the Vercel plugin. Ready to deploy — just run <code>vercel</code> from this folder.</p>
  <a class="btn" href="https://vercel.com" target="_blank">Deploy to Vercel</a>
</body>
</html>
